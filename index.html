<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний — Веб-разработка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header { text-align: center; margin-bottom: 16px; }

        .header h1 {
            color: #ffffff;
            font-size: 2.4rem;
            font-weight: 700;
        }

        .header .emoji { font-size: 2.4rem; margin-right: 10px; }

        .subtitle {
            color: #a0aec0;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 50px;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
            max-width: 960px;
            width: 100%;
        }

        .folder-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .folder-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .folder-card:active { transform: translateY(-3px); }

        .folder-icon { width: 72px; height: 72px; margin-bottom: 4px; }
        .folder-icon svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .folder-name { color: #ffffff; font-size: 1.2rem; font-weight: 700; }
        .folder-desc { color: #a0aec0; font-size: 0.88rem; line-height: 1.4; }

        .arrow {
            color: #63b3ed;
            font-size: 1.3rem;
            margin-top: 6px;
            transition: transform 0.3s ease;
        }

        .folder-card:hover .arrow { transform: translateX(5px); }

        .folder-card.disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .folder-card.disabled:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
        }

        footer { margin-top: 60px; color: #4a5568; font-size: 0.85rem; }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.7rem; }
            .folder-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
